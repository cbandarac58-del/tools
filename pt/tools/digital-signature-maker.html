<body>
  <header class="header" id="header">
    <div class="container">

    </div>

  <main class="tool-page">
    <div class="container">
      <div class="tool-layout">
        <div class="tool-main">
          <h1>Criador de Assinatura Digital Grátis (PNG Transparente)</h1>
          <p class="tool-description">Desenhe ou digite sua assinatura eletronica e baixe um arquivo PNG com fundo transparente para PDFs e contratos.</p>

          <div class="form-group" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;">
            <div>
              <label for="sigColor">Ink Color:</label>
              <select id="sigColor" class="form-select">
                <option value="#000000">Classic Black Ink (#000000)</option>
                <option value="#1e3a8a">Legal Royal Blue Ink (#1E3A8A)</option>
                <option value="#0f172a">Charcoal Navy Ink (#0F172A)</option>
              </select>
            </div>
            <div>
              <label for="sigStrokeWidth">Pen Thickness:</label>
              <select id="sigStrokeWidth" class="form-select">
                <option value="2">Fine Fountain Pen (2px)</option>
                <option value="3.5" selected>Standard Gel Pen (3.5px)</option>
                <option value="5">Bold Marker Pen (5px)</option>
              </select>
            </div>
          </div>

          <div style="background:#ffffff;border:2px solid #818cf8;border-radius:12px;padding:0.5rem;margin-bottom:1rem;text-align:center;">
            <canvas id="sigCanvas" width="680" height="220" style="width:100%;max-width:680px;height:220px;cursor:crosshair;touch-action:none;display:block;margin:0 auto;"></canvas>
          </div>

          <div class="form-group" style="display:flex;gap:0.75rem;flex-wrap:wrap;">
            <input type="text" id="sigTypedText" class="form-input" style="flex:1;min-width:200px;" placeholder="Or type your full name to generate a cursive signature...">
            <button type="button" id="btnRenderTypedSig" class="btn btn-ghost">✍️ Generate Cursive</button>
          </div>

          <div class="btn-group" style="display:flex;gap:0.75rem;flex-wrap:wrap;">
            <button type="button" id="btnDownloadSig" class="btn btn-primary">⬇️ Download Transparent PNG</button>
            <button type="button" id="btnClearSig" class="btn btn-ghost">🗑️ Clear Pad</button>
          </div>
        </div>
        <aside class="tool-sidebar" id="toolSidebar"></aside>
      </div>
    </div>
