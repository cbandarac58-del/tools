<body>
  <header class="header" id="header">
    <div class="container">

    </div>

  <main class="tool-page">
    <div class="container">
      <div class="tool-layout">
        <div class="tool-main">
          <h1>Générateur de Reçus de Paiement PDF Gratuit</h1>
          <p class="tool-description">Créez et téléchargez des reçus de paiement PDF officiels sans filigrane et sans inscription en quelques secondes.</p>

          <div class="form-group" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;">
            <div>
              <label for="recNumber">Receipt Number:</label>
              <input type="text" id="recNumber" class="form-input" value="REC-2026-104">
            </div>
            <div>
              <label for="recDate">Payment Date:</label>
              <input type="date" id="recDate" class="form-input">
            </div>
            <div>
              <label for="recMethod">Payment Method:</label>
              <select id="recMethod" class="form-select">
                <option value="Credit / Debit Card">Credit / Debit Card</option>
                <option value="Bank Wire / ACH Transfer">Bank Wire / ACH Transfer</option>
                <option value="PayPal / Stripe">PayPal / Stripe</option>
                <option value="Cash Payment">Cash Payment</option>
              </select>
            </div>
            <div>
              <label for="recCurrency">Currency:</label>
              <select id="recCurrency" class="form-select">
                <option value="$">$ (USD)</option>
                <option value="EUR ">€ (EUR)</option>
                <option value="GBP ">£ (GBP)</option>
                <option value="LKR ">LKR (Rs)</option>
              </select>
            </div>
          </div>

          <div class="form-group" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem;">
            <div>
              <label for="recMerchant">Merchant / Business Name:</label>
              <input type="text" id="recMerchant" class="form-input" value="Apex Digital Studio LLC">
            </div>
            <div>
              <label for="recCustomer">Paid By (Customer / Client Name):</label>
              <input type="text" id="recCustomer" class="form-input" value="Global Ventures Inc.">
            </div>
          </div>

          <div class="form-group" style="display:grid;grid-template-columns:2fr 1fr 1fr;gap:1rem;">
            <div>
              <label for="recDesc">Item / Service Description:</label>
              <input type="text" id="recDesc" class="form-input" value="Monthly Software Retainer & Cloud Hosting">
            </div>
            <div>
              <label for="recAmount">Amount Paid:</label>
              <input type="number" id="recAmount" class="form-input" value="450.00" min="0" step="0.01">
            </div>
            <div>
              <label for="recTax">Tax Amount:</label>
              <input type="number" id="recTax" class="form-input" value="0.00" min="0" step="0.01">
            </div>
          </div>

          <div class="result-box" style="margin-top:1.5rem;">
            <div class="result-header">
              <div>
                <span style="font-size:0.85rem;color:rgba(255,255,255,0.6);">Total Paid Receipt Amount:</span>
                <div id="recTotalOut" style="font-size:1.75rem;font-weight:800;color:#34d399;">$450.00</div>
              </div>
              <button id="btnDownloadReceiptPdf" class="btn btn-primary">⬇️ Download PDF Receipt</button>
            </div>
          </div>
        </div>
        <aside class="tool-sidebar" id="toolSidebar"></aside>
